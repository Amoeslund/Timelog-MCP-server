name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # .npmrc min-release-age needs npm >= 11; Node 22 ships npm 10.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      - run: npm run build
      - run: npm test
